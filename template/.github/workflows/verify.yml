# The full verify tier on every PR and push to main: unit, property and e2e
# tests (browser tests too, when the project has playwright.config.ts), lint,
# type checks, dependency-cruiser, guard. It never writes snapshots.
#
# On PRs, `raw-stack snapshots` lists new snapshots for review and fails on any
# snapshot that was changed or removed, until a maintainer adds the
# snapshots-approved label. Adding or removing the label re-runs it.
name: verify

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Browser tests run inside Playwright's own image, which ships the browsers
  # and the system libraries they need, so CI installs nothing for them. Its
  # tag must match the project's Playwright version, read here from the
  # lockfile. Without playwright.config.ts the image is empty and verify runs
  # on the plain runner.
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pnpm-lock.yaml
            playwright.config.ts
          sparse-checkout-cone-mode: false
      - id: image
        run: |
          [ -f playwright.config.ts ] || exit 0
          version=$(grep -oE "^  '?@playwright/test@[0-9][^':(]*" pnpm-lock.yaml | head -1 | sed 's/.*@//')
          if [ -z "$version" ]; then
            echo "::error::playwright.config.ts exists but pnpm-lock.yaml has no @playwright/test."
            exit 1
          fi
          echo "image=mcr.microsoft.com/playwright:v$version-noble" >> "$GITHUB_OUTPUT"

  verify:
    needs: browsers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ needs.browsers.outputs.image }}
      # The runner's own user, as Playwright's docs advise, so files in the
      # workspace stay the runner's.
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: snapshots
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'snapshots-approved') && '--approved' || '' }}
        run: pnpm exec raw-stack snapshots --base "$BASE" $APPROVED
