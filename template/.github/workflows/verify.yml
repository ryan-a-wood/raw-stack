# The full verify tier on every PR and push to main: unit, property and e2e
# tests (browser tests too, when the project has playwright.config.ts), lint,
# type checks, dependency-cruiser, guard. It never writes snapshots.
#
# On PRs, `raw-stack snapshots` lists new, changed and removed snapshots, with
# the old values, in the job summary for the reviewer. It never fails the run.
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Browser tests run on PRs and on the push to main. For a project with one
# developer who merges each PR once it's green, uncomment one line to run them
# on only one: PR_ off leaves them to the push to main (fast PRs); MAIN_ off
# leaves them to PRs (the merge was tested on its PR, so main deploys sooner).
# Everything else always runs.
# env:
#   RAW_STACK_PR_BROWSER_TESTS: "off"
#   RAW_STACK_MAIN_BROWSER_TESTS: "off"

jobs:
  # Browser tests run inside Playwright's own image, which ships the browsers
  # and the system libraries they need, so CI installs nothing for them. Its
  # tag must match the project's Playwright version, read here from the
  # lockfile. Without playwright.config.ts, or on a run with browser tests off,
  # the image is empty and verify runs on the plain runner.
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pnpm-lock.yaml
            playwright.config.ts
          sparse-checkout-cone-mode: false
      - id: image
        run: |
          [ -f playwright.config.ts ] || exit 0
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "${RAW_STACK_PR_BROWSER_TESTS:-}" = off ]; then exit 0; fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "${RAW_STACK_MAIN_BROWSER_TESTS:-}" = off ]; then exit 0; fi
          version=$(grep -oE "^  '?@playwright/test@[0-9][^':(]*" pnpm-lock.yaml | head -1 | sed 's/.*@//')
          if [ -z "$version" ]; then
            echo "::error::playwright.config.ts exists but pnpm-lock.yaml has no @playwright/test."
            exit 1
          fi
          echo "image=mcr.microsoft.com/playwright:v$version-noble" >> "$GITHUB_OUTPUT"

  verify:
    needs: browsers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ needs.browsers.outputs.image }}
      # The runner's own user, as Playwright's docs advise, so files in the
      # workspace stay the runner's.
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: snapshots
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: pnpm exec raw-stack snapshots --base "$BASE"
